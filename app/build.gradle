plugins {
    id 'com.android.application'
}

android {
    namespace 'xyz.framextv.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'xyz.framextv.tv'
        minSdk 21
        // Kept below 35 on purpose: targetSdk 35 forces edge-to-edge insets on the activity.
        targetSdk 34
        versionCode 9
        versionName '1.1.7'
    }

    // Official releases are signed with a private key supplied through keystore.properties
    // (local) or KEYSTORE_* environment variables (CI). Without either, builds fall back to the
    // debug key, so anyone can build from source - but such builds cannot update over an official one.
    def keystoreProps = new Properties()
    def keystoreFile = rootProject.file('keystore.properties')
    if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }
    def signValue = { String prop, String env -> keystoreProps.getProperty(prop) ?: System.getenv(env) }

    signingConfigs {
        release {
            def path = signValue('storeFile', 'KEYSTORE_FILE')
            if (path) {
                storeFile file(path)
                storePassword signValue('storePassword', 'KEYSTORE_PASSWORD')
                keyAlias signValue('keyAlias', 'KEY_ALIAS')
                keyPassword signValue('keyPassword', 'KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release.storeFile ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "frameXTV-${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    // WebMessageListener (origin-restricted JS bridge) and document-start script injection.
    implementation 'androidx.webkit:webkit:1.12.1'
    // FileProvider, used to give the system installer access to the downloaded update.
    implementation 'androidx.core:core:1.13.1'
}
